# Netlify Configuration for Pádel Reservas Frontend

[build]
  publish = "dist"
  command = "npm run build"

# 1. Regla de proxy inverso hacia el backend en Cloud Run (mismo origen, status 200)
[[redirects]]
  from = "/api/*"
  to = "https://padel-backend-1058303442470.europe-west1.run.app/:splat"
  status = 200
  force = true
  headers = {Host = "padel-backend-1058303442470.europe-west1.run.app", X-Forwarded-Host = "padelreservas.netlify.app"}

# 2. Regla de fallback para Single Page Application (SPA / React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
