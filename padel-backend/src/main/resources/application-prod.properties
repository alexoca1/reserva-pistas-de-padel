spring.application.name=API Padel

# Base de datos gestionada en la nube (Aiven MySQL con SSL obligatorio)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool HikariCP optimizado para Aiven
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Clave secreta JWT
jwt.secret=${JWT_SECRET}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Seguridad de cookies en producción (HTTPS obligatorio)
app.cookie.secure=true
app.frontend-origin=${FRONTEND_ORIGIN:https://reserva-pistas-de-padel.netlify.app}

# Resolucion de IP real del cliente tras proxy inverso (Cloud Run / Netlify)
server.forward-headers-strategy=framework

# Puerto dinamico inyectado por Cloud Run
server.port=${PORT:8081}

# Limite de subida de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
