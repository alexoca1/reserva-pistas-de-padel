spring.application.name=API Padel

# Configuración de conexión a la BD para tests
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/padel_reservas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8081

# Clave secreta JWT para tests
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLTEyMzQ1Njc4OTAxMjM0NTY=

# Seed passwords para inicialización en tests
ADMIN_SEED_PASSWORD=admin123
DEMO_ADMIN_SEED_PASSWORD=Demo2026!

# Cloudinary dummy para tests
cloudinary.cloud-name=demo
cloudinary.api-key=123
cloudinary.api-secret=abc

# Seed de datos demo desactivado
app.seed.demo=false
